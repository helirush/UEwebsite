<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting to Executive Brief</title>
  <meta name="robots" content="noindex, nofollow" />
  <script>
    (function () {
      const current = new URL(window.location.href);
      const target = new URL("../../james-richards-progress-report/", current);
      current.searchParams.forEach(function (value, key) {
        target.searchParams.set(key, value);
      });
      if (!target.searchParams.has("ue_target")) {
        target.searchParams.set(
          "ue_target",
          "/UnityEnergy/customer-portal/foster-farms/executive/james-richards-progress-report/"
        );
      }
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  Redirecting to the executive brief…
</body>
</html>
