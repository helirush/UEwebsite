<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OG Card · Foster Farms Executive Update</title>
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(145deg, #2f4825 0%, #3f5f2e 45%, #698140 100%);
      color: #f8f4e6;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 34px 42px;
      box-sizing: border-box;
    }

    .rings {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.25;
    }

    .ring {
      position: absolute;
      border: 2px solid rgba(240, 221, 170, 0.46);
      border-radius: 999px;
    }

    .r1 { width: 520px; height: 520px; left: -190px; top: -150px; }
    .r2 { width: 460px; height: 460px; right: -140px; top: -110px; }
    .r3 { width: 780px; height: 780px; left: 260px; top: 200px; }

    .letterhead {
      width: 760px;
      display: block;
      margin-bottom: 20px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      padding: 8px 12px;
    }

    .kicker {
      margin: 0 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: 15px;
      color: #e8d9ad;
      font-weight: 800;
    }

    .title {
      margin: 0 0 10px;
      font-size: 56px;
      line-height: 0.98;
      font-weight: 800;
      max-width: 920px;
      color: #f8f4e6;
    }

    .subtitle {
      margin: 0 0 16px;
      font-size: 32px;
      line-height: 1.12;
      color: #f3e4bd;
      max-width: 970px;
      font-weight: 600;
    }

    .stamp {
      margin: 0;
      font-size: 23px;
      color: #dbe7cb;
      letter-spacing: 0.02em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="rings">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
    </div>
    <img class="letterhead" src="./ue-letterhead.png" alt="Unity Energy letterhead" />
    <p class="kicker">Private Executive Update</p>
    <p class="title">Foster Farms Executive Update</p>
    <p class="subtitle">Electrical Visibility &amp; Intelligence Progress Report</p>
    <p class="stamp" id="stampLine">Review Copy · Unity Energy Update · UE.26.0526</p>
  </div>
  <script>
    (function () {
      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function formatStamp(dateObj) {
        const yy = String(dateObj.getFullYear()).slice(-2);
        const mm = pad2(dateObj.getMonth() + 1);
        const dd = pad2(dateObj.getDate());
        return `UE.${yy}.${mm}${dd}`;
      }

      function parseStamp(rawValue) {
        const value = String(rawValue || "").trim().toUpperCase();
        if (!/^UE\.\d{2}\.\d{4}$/.test(value)) return null;
        return value;
      }

      const pageUrl = new URL(window.location.href);
      const stampCode = parseStamp(pageUrl.searchParams.get("ue_doc")) || formatStamp(new Date());
      const stampLine = document.getElementById("stampLine");
      if (stampLine) {
        stampLine.textContent = `Review Copy · Unity Energy Update · ${stampCode}`;
      }
    })();
  </script>
</body>
</html>
