<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OG Card · Foster Farms Executive Update</title>
  <style>
    :root { --scale: 1; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(145deg, #2f4825 0%, #3f5f2e 45%, #698140 100%);
      color: #f8f4e6;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 34px 42px;
      box-sizing: border-box;
    }

    .rings {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.25;
    }

    .ring {
      position: absolute;
      border: calc(2px * var(--scale)) solid rgba(240, 221, 170, 0.46);
      border-radius: 999px;
    }

    .r1 { width: calc(520px * var(--scale)); height: calc(520px * var(--scale)); left: calc(-190px * var(--scale)); top: calc(-150px * var(--scale)); }
    .r2 { width: calc(460px * var(--scale)); height: calc(460px * var(--scale)); right: calc(-140px * var(--scale)); top: calc(-110px * var(--scale)); }
    .r3 { width: calc(780px * var(--scale)); height: calc(780px * var(--scale)); left: calc(260px * var(--scale)); top: calc(200px * var(--scale)); }

    .letterhead {
      width: calc(760px * var(--scale));
      display: block;
      margin-bottom: calc(20px * var(--scale));
      border-radius: calc(8px * var(--scale));
      background: rgba(255, 255, 255, 0.86);
      padding: calc(8px * var(--scale)) calc(12px * var(--scale));
      transform-origin: left top;
    }

    .kicker {
      margin: 0 0 calc(10px * var(--scale));
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-size: calc(15px * var(--scale));
      color: #e8d9ad;
      font-weight: 800;
    }

    .title {
      margin: 0 0 calc(10px * var(--scale));
      font-size: calc(56px * var(--scale));
      line-height: 0.98;
      font-weight: 800;
      max-width: calc(920px * var(--scale));
      color: #f8f4e6;
    }

    .subtitle {
      margin: 0 0 calc(16px * var(--scale));
      font-size: calc(32px * var(--scale));
      line-height: 1.12;
      color: #f3e4bd;
      max-width: calc(970px * var(--scale));
      font-weight: 600;
    }

    .stamp {
      margin: 0;
      font-size: calc(23px * var(--scale));
      color: #dbe7cb;
      letter-spacing: 0.02em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="rings">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
    </div>
    <img class="letterhead" src="./ue-letterhead.png" alt="Unity Energy letterhead" />
    <p class="kicker">Private Executive Update</p>
    <p class="title">Foster Farms Executive Update</p>
    <p class="subtitle">Electrical Visibility &amp; Intelligence Progress Report</p>
    <p class="stamp" id="stampLine">Review Copy · Unity Energy Update · UE.26.0526</p>
  </div>
  <script>
    (function () {
      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      function formatStamp(dateObj) {
        const yy = String(dateObj.getFullYear()).slice(-2);
        const mm = pad2(dateObj.getMonth() + 1);
        const dd = pad2(dateObj.getDate());
        return `UE.${yy}.${mm}${dd}`;
      }

      function parseStamp(rawValue) {
        const value = String(rawValue || "").trim().toUpperCase();
        if (!/^UE\.\d{2}\.\d{4}$/.test(value)) return null;
        return value;
      }

      const pageUrl = new URL(window.location.href);
      const stampCode = parseStamp(pageUrl.searchParams.get("ue_doc")) || formatStamp(new Date());
      const stampLine = document.getElementById("stampLine");
      if (stampLine) {
        stampLine.textContent = `Review Copy · Unity Energy Update · ${stampCode}`;
      }

      // Apply a global scale variable from the URL: ?scale=1.1
      (function applyScaleFromUrl() {
        const raw = pageUrl.searchParams.get("scale");
        if (!raw) return;
        const v = parseFloat(raw);
        if (!isFinite(v)) return;
        const clamped = Math.max(0.2, Math.min(3, v));
        document.documentElement.style.setProperty("--scale", String(clamped));
      })();
    })();
  </script>
</body>
</html>
