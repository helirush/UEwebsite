<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project-Memo</title>
  <meta name="description" content="Project-Memo share card from Unity Energy." />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="Project-Memo" />
  <meta property="og:description" content="Project-Memo" />
  <meta property="og:url" content="https://unityenergy.com/UnityEnergy/customer-portal/foster-farms/executive/share/project-memo.html?ue_doc=UE.0609.04" />
  <meta property="og:image" content="https://unityenergy.com/UnityEnergy/assets/images/share-card-bases/ProjectMemo.png?ue_doc=UE.0609.04&ue_img=UEPROJECTMEMO" />
  <meta property="og:image:alt" content="Project-Memo share card" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Project-Memo" />
  <meta property="twitter:description" content="Project-Memo" />
  <meta property="twitter:image" content="https://unityenergy.com/UnityEnergy/assets/images/share-card-bases/ProjectMemo.png?ue_doc=UE.0609.04&ue_img=UEPROJECTMEMO" />
  <script>
    (function () {
      const SHARE_KIND = "project-memo";
      const RETIRED_TEST_STAMPS = Object.freeze(["UE.26.0528"]);
      const RETIRED_TEST_MESSAGE = "This was used for testing purposes. Please contact Unity for the updated link.";
      function pad2(value) {
        return String(value).padStart(2, "0");
      }
      function formatStamp(dateObj, revisionCounter) {
        const mm = pad2(dateObj.getMonth() + 1);
        const dd = pad2(dateObj.getDate());
        const parsedRevision = Number.parseInt(revisionCounter, 10);
        const normalizedRevision = Number.isFinite(parsedRevision) && parsedRevision > 0 ? parsedRevision : 1;
        const rr = pad2(normalizedRevision);
        return `UE.${mm}${dd}.${rr}`;
      }
      function parseStamp(rawValue) {
        const value = String(rawValue || "").trim().toUpperCase();
        if (/^UE\.\d{2}\.\d{4}$/.test(value)) return value;
        if (/^UE\.\d{4}\.\d{2}$/.test(value)) return value;
        return null;
      }
      function normalizeStatus(rawValue) {
        const value = String(rawValue || "").trim().toLowerCase();
        if (value === "published") return "published";
        if (value === "test") return "test";
        return "review";
      }
      function normalizeRecipientKey(rawValue) {
        return String(rawValue || "").trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
      }
      function normalizeRouteAddress(rawValue) {
        return String(rawValue || "").trim().toLowerCase().replace(/[^a-z0-9@._+-]/g, "");
      }
      function renderUnavailable(message) {
        document.addEventListener("DOMContentLoaded", function () {
          if (!document.body) return;
          document.body.textContent = message;
        });
      }
      function buildPreviewImageUrl(stampCode) {
        const previewUrl = new URL("/UnityEnergy/assets/images/share-card-bases/ProjectMemo.png", window.location.origin);
        if (stampCode) {
          previewUrl.searchParams.set("ue_doc", stampCode);
        }
        return previewUrl.toString();
      }
      function renderTapAnywhereCard(url, stampCode) {
        const mountCard = function () {
          if (!document.body) return;
          document.body.innerHTML = "";
          document.body.style.margin = "0";
          document.body.style.minHeight = "100vh";
          document.body.style.display = "grid";
          document.body.style.placeItems = "center";
          document.body.style.background = "#f3f4ef";
          const cardLink = document.createElement("a");
          cardLink.href = url;
          cardLink.style.display = "grid";
          cardLink.style.gap = "10px";
          cardLink.style.width = "min(94vw, 820px)";
          cardLink.style.textDecoration = "none";
          cardLink.style.color = "#22311d";
          cardLink.style.fontFamily = "Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
          cardLink.style.fontWeight = "600";
          cardLink.style.fontSize = "14px";
          cardLink.style.textAlign = "center";
          cardLink.setAttribute("aria-label", "Open Project-Memo");
          const cardImage = document.createElement("img");
          cardImage.src = buildPreviewImageUrl(stampCode);
          cardImage.alt = "Project-Memo share card";
          cardImage.style.width = "100%";
          cardImage.style.height = "auto";
          cardImage.style.display = "block";
          cardImage.style.borderRadius = "14px";
          cardImage.style.boxShadow = "0 12px 34px rgba(20,31,12,.20)";
          const cardLabel = document.createElement("span");
          cardLabel.textContent = "Tap anywhere on this share card to open project memo link.";
          cardLink.appendChild(cardImage);
          cardLink.appendChild(cardLabel);
          document.body.appendChild(cardLink);
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", mountCard, { once: true });
          return;
        }
        mountCard();
      }
      function openTargetLink(url, stampCode) {
        renderTapAnywhereCard(url, stampCode);
        const navigate = function () {
          try {
            window.location.replace(url);
          } catch (_err) {
            window.location.href = url;
          }
        };
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function () {
            window.setTimeout(navigate, 80);
          }, { once: true });
          return;
        }
        window.setTimeout(navigate, 80);
      }
      const pageUrl = new URL(window.location.href);
      const incomingStamp = parseStamp(pageUrl.searchParams.get("ue_doc"));
      if (incomingStamp && RETIRED_TEST_STAMPS.indexOf(incomingStamp) !== -1) {
        renderUnavailable(RETIRED_TEST_MESSAGE);
        return;
      }
      const incomingStatus = normalizeStatus(pageUrl.searchParams.get("ue_status"));
      if (incomingStatus !== "published") {
        renderUnavailable("This share link is unavailable while the document is in review/test mode.");
        return;
      }
      const stampCode = parseStamp(pageUrl.searchParams.get("ue_doc")) || formatStamp(new Date());
      const targetPath = String(pageUrl.searchParams.get("ue_target") || "../executive-update/");
      const target = new URL(targetPath, window.location.href);
      target.searchParams.set("ue_doc", stampCode);
      target.searchParams.set("ue_kind", SHARE_KIND);
      target.searchParams.set("ue_share", pageUrl.searchParams.get("ue_share") || String(Date.now()));
      target.searchParams.set("ue_status", "published");
      target.searchParams.set("ue_autoplay", "1");
      const incomingRevision = String(pageUrl.searchParams.get("ue_rev") || "").trim();
      if (incomingRevision) {
        target.searchParams.set("ue_rev", incomingRevision);
      }
      const incomingTitle = String(pageUrl.searchParams.get("ue_title") || "").trim();
      if (incomingTitle) {
        target.searchParams.set("ue_title", incomingTitle);
      }
      const recipientKey = normalizeRecipientKey(pageUrl.searchParams.get("ue_recipient"));
      if (recipientKey) {
        target.searchParams.set("ue_recipient", recipientKey);
      }
      const customerKey = normalizeRecipientKey(pageUrl.searchParams.get("ue_customer"));
      if (customerKey) {
        target.searchParams.set("ue_customer", customerKey);
      }
      const senderAddress = normalizeRouteAddress(pageUrl.searchParams.get("ue_from"));
      if (senderAddress) {
        target.searchParams.set("ue_from", senderAddress);
      }
      const recipientAddress = normalizeRouteAddress(pageUrl.searchParams.get("ue_to"));
      if (recipientAddress) {
        target.searchParams.set("ue_to", recipientAddress);
      }
      target.searchParams.set("ue_target", targetPath);
      openTargetLink(target.toString(), stampCode);
    })();
  </script>
</head>
<body>
  Redirecting to the project memo…
</body>
</html>
