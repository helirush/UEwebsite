  <script>
    (function () {
      const SHARE_KIND = "update";
      const RETIRED_TEST_STAMPS = Object.freeze(["UE.26.0528"]);
      const RETIRED_TEST_MESSAGE = "This was used for testing purposes. Please contact Unity for the updated link.";
      function pad2(value) {
        return String(value).padStart(2, "0");
      }
      function formatStamp(dateObj, revisionCounter) {
        const mm = pad2(dateObj.getMonth() + 1);
        const dd = pad2(dateObj.getDate());
        const parsedRevision = Number.parseInt(revisionCounter, 10);
        const normalizedRevision = Number.isFinite(parsedRevision) && parsedRevision > 0 ? parsedRevision : 1;
        const rr = pad2(normalizedRevision);
        return `UE.${mm}${dd}.${rr}`;
      }
      function parseStamp(rawValue) {
        const value = String(rawValue || "").trim().toUpperCase();
        if (/^UE\.\d{2}\.\d{4}$/.test(value)) return value;
        if (/^UE\.\d{4}\.\d{2}$/.test(value)) return value;
        return null;
      }
      function normalizeStatus(rawValue) {
        const value = String(rawValue || "").trim().toLowerCase();
        if (value === "published") return "published";
        if (value === "test") return "test";
        return "review";
      }
      function renderUnavailable(message) {
        document.addEventListener("DOMContentLoaded", function () {
          if (!document.body) return;
          document.body.textContent = message;
        });
      }
      const pageUrl = new URL(window.location.href);
      const incomingStamp = parseStamp(pageUrl.searchParams.get("ue_doc"));
      if (incomingStamp && RETIRED_TEST_STAMPS.indexOf(incomingStamp) !== -1) {
        renderUnavailable(RETIRED_TEST_MESSAGE);
        return;
      }
      const incomingStatus = normalizeStatus(pageUrl.searchParams.get("ue_status"));
      if (incomingStatus !== "published") {
        renderUnavailable("This share link is unavailable while the document is in review/test mode.");
        return;
      }
      const stampCode = parseStamp(pageUrl.searchParams.get("ue_doc")) || formatStamp(new Date());
      const targetPath = String(pageUrl.searchParams.get("ue_target") || "../james-richards-progress-report/");
      const target = new URL(targetPath, window.location.href);
      target.searchParams.set("ue_doc", stampCode);
      target.searchParams.set("ue_kind", SHARE_KIND);
      target.searchParams.set("ue_share", pageUrl.searchParams.get("ue_share") || String(Date.now()));
      target.searchParams.set("ue_status", "published");
      const incomingRevision = String(pageUrl.searchParams.get("ue_rev") || "").trim();
      if (incomingRevision) {
        target.searchParams.set("ue_rev", incomingRevision);
      }
      target.searchParams.set("ue_target", targetPath);
      window.location.replace(target.toString());
    })();
  </script>
